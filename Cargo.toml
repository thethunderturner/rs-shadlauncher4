[package]
name = "rs-shadLauncher4"
version = "0.2.1"
edition = "2024"
license = "GPL-2"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg", "image", "file"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
alto = "3.0.4"
rfd = "0.18.0"
sdl3 = { version = "0.22.1", features = ["build-from-source-static"] }
sdl3-sys = "0.7.3"
ash = "0.38.0"
open = "5.4.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
image = "0.25.10"
ureq = "3.5.2"
ring = "0.17.14"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice"] }

[build-dependencies]
cc = "1.11.2"

[package.metadata.appimage]
icon = "src/assets/icon.png"