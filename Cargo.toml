[package]
name = "rs-shadlauncher4"
version = "0.1.0"
edition = "2024"
license = "GPL-2"

[dependencies]
ash = "0.38.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
eframe = { version = "0.36.2", features = ["glow"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["svg", "image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sdl3 = { version = "0.20.0", features = ["build-from-source-static"] }
alto = "3.0.4"
ureq = "3.4.2"
tempfile = "3.27.0"

[build-dependencies]
cc = "1.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice"] }

[package.metadata.appimage]
icon = "src/assets/icon.png"
