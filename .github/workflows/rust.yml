name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-26

    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      # Linux
      - name: Install AppImage tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y file wget
          cargo install cargo-appimage --locked
          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 cargo appimage
          mkdir -p dist
          cp \
            target/appimage/rs-shadlauncher4.AppImage \
            dist/rs-shadlauncher4-linux-x86_64.AppImage

      # Windows
      - name: Prepare Windows build
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item `
            target\release\rs-shadlauncher4.exe `
            dist\rs-shadlauncher4-windows-x86_64.exe

      # macOS
      - name: Prepare macOS build
        if: matrix.os == 'macos-26'
        run: |
          mkdir -p dist
          cp \
            target/release/rs-shadlauncher4 \
            dist/rs-shadlauncher4-macos-arm64

      # Upload build artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rs-shadlauncher4-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  prerelease:
    name: Create prerelease
    needs: build

    # Dont create a GitHub release for PR builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rs-shadlauncher4-*
          path: release
          merge-multiple: true

      - name: Inspect release files
        run: ls -alh release/

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_DATE=$(TZ=Europe/Amsterdam date +'%d/%m/%Y')
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="continuous-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "shadlauncher-${RELEASE_DATE}-${SHORT_SHA}" \
            --notes "Automated development build from main." \
            --prerelease \
            --latest=false

  upload-release:
    name: Upload artifacts to release
    needs: build

    if: github.event_name == 'release'

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rs-shadlauncher4-*
          path: release
          merge-multiple: true

      - name: Inspect release files
        run: ls -alh release/

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber